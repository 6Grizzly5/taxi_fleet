<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<!-- En-tête commun : <head th:replace="~{fragments/layout :: head('Titre de la page')}"></head> -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | TaxiParking'">TaxiParking</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- Barre du haut : <div th:replace="~{fragments/layout :: topbar('admin', 'courses')}"></div>
     role  : admin | client | chauffeur
     active: clé du lien à mettre en évidence -->
<header class="topbar" th:fragment="topbar(role, active)">
    <div class="topbar-inner">
        <a class="skip" href="#contenu">Aller au contenu</a>

        <button class="back" type="button" aria-label="Page précédente"
                onclick="if(history.length>1){history.back()}else{location.href='/'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>

        <a class="brand" th:href="@{/}">
            <svg viewBox="0 0 40 40" aria-hidden="true">
                <rect x="15" y="4" width="10" height="5" rx="2" fill="currentColor"/>
                <rect x="3" y="8" width="34" height="22" rx="6" fill="currentColor"/>
                <rect x="9" y="30" width="22" height="4" rx="1.5" fill="currentColor"/>
                <rect class="ink" x="11" y="14" width="18" height="3.5"/>
                <rect class="ink" x="18.25" y="14" width="3.5" height="11"/>
            </svg>
            <span class="brand-name">TaxiParking</span>
        </a>

        <nav class="mainnav" aria-label="Navigation principale">
            <th:block th:if="${role == 'admin'}">
                <a th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard'} ? 'is-active'" th:attr="aria-current=${active == 'dashboard'} ? 'page'">Tableau de bord</a>
                <a th:href="@{/clients}" th:classappend="${active == 'clients'} ? 'is-active'" th:attr="aria-current=${active == 'clients'} ? 'page'">Clients</a>
                <a th:href="@{/chauffeurs}" th:classappend="${active == 'chauffeurs'} ? 'is-active'" th:attr="aria-current=${active == 'chauffeurs'} ? 'page'">Chauffeurs</a>
                <a th:href="@{/vehicules}" th:classappend="${active == 'vehicules'} ? 'is-active'" th:attr="aria-current=${active == 'vehicules'} ? 'page'">Véhicules</a>
                <a th:href="@{/courses}" th:classappend="${active == 'courses'} ? 'is-active'" th:attr="aria-current=${active == 'courses'} ? 'page'">Courses</a>
                <a th:href="@{/admin/parking}" th:classappend="${active == 'parking'} ? 'is-active'" th:attr="aria-current=${active == 'parking'} ? 'page'">Parking</a>
            </th:block>
            <th:block th:if="${role == 'client'}">
                <a th:href="@{/client/dashboard}" th:classappend="${active == 'dashboard'} ? 'is-active'" th:attr="aria-current=${active == 'dashboard'} ? 'page'">Mon espace</a>
                <a th:href="@{/client/course/nouveau}" th:classappend="${active == 'course'} ? 'is-active'" th:attr="aria-current=${active == 'course'} ? 'page'">Commander un taxi</a>
                <a th:href="@{/client/parking}" th:classappend="${active == 'parking'} ? 'is-active'" th:attr="aria-current=${active == 'parking'} ? 'page'">Parking</a>
            </th:block>
            <th:block th:if="${role == 'chauffeur'}">
                <a th:href="@{/chauffeur/dashboard}" th:classappend="${active == 'dashboard'} ? 'is-active'" th:attr="aria-current=${active == 'dashboard'} ? 'page'">Mes courses</a>
            </th:block>
        </nav>

        <div class="topbar-user">
            <span class="who" th:text="${role == 'admin'} ? 'Administration' : (${role == 'client'} ? 'Espace client' : (${role == 'chauffeur'} ? 'Espace chauffeur' : ''))">Espace</span>
            <form method="post" th:action="@{/logout}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-ghost btn-sm" type="submit">Déconnexion</button>
            </form>
        </div>
    </div>
</header>

<!-- Pastille de statut : <span th:replace="~{fragments/layout :: statut(${c.statut})}"></span>
     Remet les accents des valeurs d'enum (TERMINEE -> Terminée) et applique la couleur du statut. -->
<span class="tag" th:fragment="statut(s)" th:classappend="'st-' + ${s}"
      th:text="${#strings.replace(#strings.replace(s, '_', ' '), 'EE', 'ÉE')}">Statut</span>

<!-- Pagination : <nav th:replace="~{fragments/layout :: pager(${page}, '/clients')}"></nav>
     Reprend la recherche en cours (paramètre "search") quand il y en a une. -->
<nav class="pager" th:fragment="pager(p, base)" th:if="${p.totalPages > 1}" aria-label="Pagination"
     th:with="q=${param.search != null} ? ${param.search[0]} : null">
    <a class="btn btn-line btn-sm" th:if="${!p.first}"
       th:href="${q != null} ? @{${base}(page=${p.number - 1}, search=${q})} : @{${base}(page=${p.number - 1})}">Précédent</a>
    <span class="pager-info" th:text="|Page ${p.number + 1} sur ${p.totalPages}|">Page 1 sur 3</span>
    <a class="btn btn-line btn-sm" th:if="${!p.last}"
       th:href="${q != null} ? @{${base}(page=${p.number + 1}, search=${q})} : @{${base}(page=${p.number + 1})}">Suivant</a>
</nav>

</body>
</html>
