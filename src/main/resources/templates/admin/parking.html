<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion du parking | TaxiParking</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a;margin:0}nav{background:#111;color:white;padding:16px 5%;display:flex;gap:14px;align-items:center}nav a{color:white;text-decoration:none}.nav-back{background:#292929;color:#fff;border:1px solid #555;border-radius:7px;padding:8px 12px;cursor:pointer;font:inherit}nav form{margin-left:auto}main{max-width:1200px;margin:32px auto;padding:0 20px}.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001;margin:18px 0}table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left}.btn{display:inline-block;background:#111;color:white;padding:9px 14px;border-radius:7px;text-decoration:none;border:0;cursor:pointer}.badge{padding:5px 9px;background:#eef2ff;border-radius:20px}@media(max-width:700px){main{overflow-x:auto}nav{flex-wrap:wrap}}
</style></head>
<body>
<nav>
<button class="nav-back" type="button" onclick="if(history.length>1){history.back()}else{location.href='/admin/dashboard'}">← Retour</button>
<strong>TaxiParking · Administration</strong>
<a th:href="@{/admin/dashboard}">Tableau de bord</a>
<form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn">Déconnexion</button></form>
</nav>
<main>
<h1>Gestion du parking</h1>
<p>Vue d’ensemble des places et des réservations enregistrées.</p>
<section class="card">
<h2>Places de parking</h2>
<table><thead><tr><th>Numéro</th><th>Zone</th><th>Type</th><th>Statut</th></tr></thead>
<tbody><tr th:each="p:${placesList}"><td th:text="${p.numero}"></td><td th:text="${p.zone}"></td><td th:text="${p.type}"></td><td><span class="badge" th:text="${p.statut}"></span></td></tr></tbody>
</table>
</section>
<section class="card">
<h2>Réservations</h2>
<table><thead><tr><th>Client</th><th>Véhicule</th><th>Place</th><th>Arrivée</th><th>Départ</th><th>Tarif (Ar)</th><th>Statut</th></tr></thead>
<tbody><tr th:each="r:${reservationsPage.content}"><td th:text="${r.utilisateurNom}"></td><td th:text="${r.immatriculation}"></td><td th:text="${r.numeroPlace}"></td><td th:text="${r.arriveePrevue}"></td><td th:text="${r.departPrevu}"></td><td th:text="${r.tarif}"></td><td th:text="${r.statut}"></td></tr>
<tr th:if="${#lists.isEmpty(reservationsPage.content)}"><td colspan="7">Aucune réservation pour le moment.</td></tr></tbody>
</table>
</section>
</main>
</body></html>
