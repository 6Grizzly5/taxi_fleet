<!doctype html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Administration</title>
	<style>
		body {
			font-family: Arial,sans-serif;
			background: #f4f6f8;
			color: #17202a;
			margin: 0
		}
		nav {
			background: #111;
			color: white;
			padding: 16px 5%;
			display: flex;
			gap: 18px;
			align-items: center
		}
		nav a { color: white; text-decoration: none }
		main { max-width: 1200px; margin: 35px auto; padding: 0 20px }
		.grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 16px }
		.card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 3px 12px #0001 }
		.btn { display: inline-block; background: #111; color: white; padding: 9px 14px; border-radius: 7px; text-decoration: none; border: 0; cursor: pointer }
		.btn.green { background: #15803d }
		.btn.red { background: #b91c1c }
		.btn.blue { background: #2563eb }
		input,select { padding: 10px; width: 100%; box-sizing: border-box; margin: 5px 0 14px; border: 1px solid #ccd2d8; border-radius: 7px }
		table { width: 100%; border-collapse: collapse; background: white }
		th,td { padding: 11px; border-bottom: 1px solid #ddd; text-align: left }
		.muted { color: #68707a }
		.error { color: #b91c1c; background: #fee2e2; padding: 10px; border-radius: 7px }
		.success { color: #166534; background: #dcfce7; padding: 10px; border-radius: 7px }
	
        .nav-back{background:#292929;color:#fff;border:1px solid #555;border-radius:7px;padding:8px 12px;cursor:pointer;font:inherit}
        nav form{margin-left:auto}
        @media(max-width:600px){nav{flex-wrap:wrap}.nav-back{order:0}}
        </style>
</head>
<body>
	<nav>
		<button class="nav-back" type="button" onclick="if(history.length>1){history.back()}else{location.href='/'}">← Retour</button>
		<strong>TaxiParking</strong>
		<form method="post" th:action="@{/logout}" style="margin-left:auto">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<button class="btn" type="submit">Déconnexion</button>
		</form>
	</nav>
	<main>
		<h1>Administration TaxiParking</h1>
		<div class="grid">
			<div class="card">Utilisateurs<h2 th:text="${users}"></h2></div>
			<div class="card">Clients<h2 th:text="${clients}"></h2></div>
			<div class="card">Chauffeurs<h2 th:text="${chauffeurs}"></h2></div>
			<div class="card">Véhicules<h2 th:text="${vehicules}"></h2></div>
			<div class="card">Courses<h2 th:text="${courses}"></h2></div>
			<div class="card">En attente<h2 th:text="${pendingCourses}"></h2></div>
			<div class="card">Places libres<h2 th:text="${freePlaces}"></h2></div>
			<div class="card">Réservations<h2 th:text="${reservations}"></h2></div>
		</div>
		<h2>Supervision des chauffeurs</h2>
		<table>
			<tr>
				<th>Nom</th><th>Permis</th><th>Statut</th><th>Véhicule</th><th>Actions</th>
			</tr>
			<tr th:each="d:${drivers}">
				<td th:text="${d.nom}"></td>
				<td th:text="${d.numeroPermis}"></td>
				<td th:text="${d.statut}"></td>
				<td th:text="${d.vehicule != null ? d.vehicule.immatriculation : '-'}"></td>
				<td>
					<form style="display:inline" method="post" th:action="@{/admin/chauffeur/{id}/valider(id=${d.id})}">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<button class="btn green">Valider</button>
					</form>
					<form style="display:inline" method="post" th:action="@{/admin/chauffeur/{id}/suspendre(id=${d.id})}">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<button class="btn red">Suspendre</button>
					</form>
				</td>
			</tr>
		</table>
		<p>
			<a class="btn" th:href="@{/clients}">Clients</a>
			<a class="btn" th:href="@{/chauffeurs}">Chauffeurs</a>
			<a class="btn" th:href="@{/vehicules}">Véhicules</a>
			<a class="btn" th:href="@{/courses}">Courses</a>\n\t\t\t<a class="btn" th:href="@{/admin/parking}">Gestion du parking</a>
		</p>
	</main>
</body>
</html>
