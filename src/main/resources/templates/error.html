<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${errorTitle})}"></head>
<body>
<div class="error-page">

    <header class="error-top">
        <button class="back" type="button" aria-label="Page précédente"
                onclick="if(history.length>1){history.back()}else{location.href='/login'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <a class="brand" th:href="@{/}">
            <svg viewBox="0 0 40 40" aria-hidden="true">
                <rect x="15" y="4" width="10" height="5" rx="2" fill="currentColor"/>
                <rect x="3" y="8" width="34" height="22" rx="6" fill="currentColor"/>
                <rect x="9" y="30" width="22" height="4" rx="1.5" fill="currentColor"/>
                <rect class="ink" x="11" y="14" width="18" height="3.5"/>
                <rect class="ink" x="18.25" y="14" width="3.5" height="11"/>
            </svg>
            <span class="brand-name">TaxiParking</span>
        </a>
    </header>

    <main class="error-body" id="contenu">
        <p class="error-code" th:text="${status}" aria-label="Code d'erreur">500</p>
        <h1 th:text="${errorTitle}">Une erreur est survenue</h1>
        <p th:text="${errorMessage}">Désolé, nous n’avons pas pu accéder à cette page.</p>
        <div class="row-actions">
            <a class="btn" th:href="@{/}">Retour à l’accueil</a>
            <a class="btn btn-ghost" th:href="@{/login}">Connexion</a>
        </div>
    </main>

    <div class="checker" aria-hidden="true"></div>
</div>
</body>
</html>
