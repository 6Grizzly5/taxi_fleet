<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clients')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar('admin', 'clients')}"></div>

<main class="page" id="contenu">

    <div class="page-head">
        <h1>Clients</h1>
    </div>

    <form class="toolbar" method="get" th:action="@{/clients}">
        <input type="search" name="search" th:value="${search}" placeholder="Rechercher un client par nom" aria-label="Rechercher un client">
        <button class="btn btn-dark" type="submit">Rechercher</button>
    </form>

    <div class="panel table-panel">
        <div class="table-wrap">
            <table class="data">
                <thead><tr><th>Nom</th><th>Téléphone</th><th>Email</th></tr></thead>
                <tbody>
                    <tr th:each="c:${page.content}">
                        <td class="strong" th:text="${c.nom}"></td>
                        <td th:text="${c.telephone}"></td>
                        <td th:text="${c.email}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.content)}"><td class="empty" colspan="3">Aucun client trouvé.</td></tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/layout :: pager(${page}, '/clients')}"></nav>
    </div>

</main>
</body>
</html>
