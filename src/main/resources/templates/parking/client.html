<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Parking')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar('client', 'parking')}"></div>

<main class="page" id="contenu">

    <div class="page-head">
        <h1>Parking</h1>
    </div>

    <section class="panel panel-pad form-panel">
        <h2>Nouvelle réservation</h2>
        <form method="post" th:action="@{/client/parking/reserver}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-grid">
                <div class="field">
                    <label for="vehiculeId">Véhicule</label>
                    <select id="vehiculeId" name="vehiculeId" required>
                        <option th:each="v:${vehicules}" th:value="${v.id}" th:text="${v.immatriculation+' - '+v.marque}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="placeId">Place</label>
                    <select id="placeId" name="placeId">
                        <option value="">Attribution automatique</option>
                        <option th:each="p:${places}" th:value="${p.id}" th:text="${p.numero+' - '+p.zone+' - '+p.type}"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="arriveePrevue">Arrivée</label>
                    <input id="arriveePrevue" name="arriveePrevue" type="datetime-local" required>
                </div>
                <div class="field">
                    <label for="departPrevu">Départ</label>
                    <input id="departPrevu" name="departPrevu" type="datetime-local" required>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn" type="submit">Réserver</button>
            </div>
        </form>
    </section>

    <section class="section">
        <div class="section-head"><h2>Mes réservations</h2></div>
        <div class="panel table-panel"><div class="table-wrap">
            <table class="data">
                <thead>
                    <tr><th>Place</th><th>Véhicule</th><th>Arrivée</th><th>Départ</th><th class="num">Tarif (Ar)</th><th>Statut</th><th>Action</th></tr>
                </thead>
                <tbody>
                    <tr th:each="r:${reservations}">
                        <td class="strong" th:text="${r.numeroPlace}"></td>
                        <td><span class="plate" th:text="${r.immatriculation}"></span></td>
                        <td th:text="${#strings.replace(r.arriveePrevue, 'T', ' ')}"></td>
                        <td th:text="${#strings.replace(r.departPrevu, 'T', ' ')}"></td>
                        <td class="num" th:text="${r.tarif}"></td>
                        <td><span th:replace="~{fragments/layout :: statut(${r.statut})}"></span></td>
                        <td>
                            <form th:if="${r.statut.name() != 'ANNULEE' and r.statut.name() != 'TERMINEE'}" method="post" th:action="@{/client/parking/{id}/annuler(id=${r.id})}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-danger btn-sm" type="submit">Annuler</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(reservations)}"><td class="empty" colspan="7">Aucune réservation pour le moment.</td></tr>
                </tbody>
            </table>
        </div></div>
    </section>

</main>
</body>
</html>
