<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inscription client')}"></head>
<body>
<div class="auth">

    <section class="auth-brand">
        <a class="brand" th:href="@{/login}">
            <svg viewBox="0 0 40 40" aria-hidden="true">
                <rect x="15" y="4" width="10" height="5" rx="2" fill="currentColor"/>
                <rect x="3" y="8" width="34" height="22" rx="6" fill="currentColor"/>
                <rect x="9" y="30" width="22" height="4" rx="1.5" fill="currentColor"/>
                <rect class="ink" x="11" y="14" width="18" height="3.5"/>
                <rect class="ink" x="18.25" y="14" width="3.5" height="11"/>
            </svg>
            <span class="brand-name">TaxiParking</span>
        </a>
        <div class="auth-pitch">
            <h1>Un taxi en quelques clics.</h1>
            <p>Indiquez votre trajet, le système attribue un chauffeur disponible.</p>
        </div>
        <div class="checker" aria-hidden="true"></div>
    </section>

    <main class="auth-panel" id="contenu">
        <div class="auth-form">
            <h2>Créer un compte client</h2>
            <p class="sub">Quelques informations suffisent pour commander votre premier taxi.</p>

            <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e.defaultMessage}"></div>

            <form method="post" th:object="${request}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="field">
                    <label for="nom">Nom</label>
                    <input th:field="*{nom}" autocomplete="name">
                    <span class="field-error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
                </div>
                <div class="field">
                    <label for="telephone">Téléphone</label>
                    <input th:field="*{telephone}" type="tel" autocomplete="tel">
                    <span class="field-error" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></span>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input th:field="*{email}" type="email" autocomplete="email">
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="field">
                    <label for="motDePasse">Mot de passe</label>
                    <input th:field="*{motDePasse}" type="password" autocomplete="new-password">
                    <span class="field-error" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></span>
                </div>
                <button class="btn btn-block" type="submit">Créer le compte</button>
            </form>

            <div class="auth-links">
                <a th:href="@{/login}">J’ai déjà un compte</a>
            </div>
        </div>
    </main>

</div>
</body>
</html>
