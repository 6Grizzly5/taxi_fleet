<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Courses')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar('admin', 'courses')}"></div>

<main class="page" id="contenu">

    <div class="page-head">
        <h1>Courses</h1>
    </div>

    <form class="toolbar" method="get" th:action="@{/courses}">
        <input type="search" name="search" th:value="${param.search}" placeholder="Rechercher une course" aria-label="Rechercher une course">
        <button class="btn btn-dark" type="submit">Rechercher</button>
    </form>

    <div class="panel table-panel">
        <div class="table-wrap">
            <table class="data">
                <thead>
                    <tr><th>Client</th><th>Trajet</th><th class="num">Passagers</th><th class="num">Tarif (Ar)</th><th>Chauffeur</th><th>Statut</th><th>Action</th></tr>
                </thead>
                <tbody>
                    <tr th:each="c:${page.content}">
                        <td class="strong" th:text="${c.clientNom}"></td>
                        <td>
                            <span class="route">
                                <span th:text="${c.depart}"></span>
                                <i class="route-line" aria-hidden="true"></i>
                                <span th:text="${c.destination}"></span>
                            </span>
                        </td>
                        <td class="num" th:text="${c.nombrePersonnes}"></td>
                        <td class="num" th:text="${c.tarif}"></td>
                        <td th:text="${c.chauffeurNom ?: 'Non attribué'}"></td>
                        <td><span th:replace="~{fragments/layout :: statut(${c.statut})}"></span></td>
                        <td>
                            <div class="row-actions">
                                <form th:if="${c.statut.name() == 'EN_ATTENTE'}" method="post" th:action="@{/courses/{id}/assigner(id=${c.id})}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button class="btn btn-sm" type="submit">Attribuer</button>
                                </form>
                                <form method="post" th:action="@{/courses/{id}/annuler(id=${c.id})}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button class="btn btn-danger btn-sm" type="submit">Annuler</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.content)}"><td class="empty" colspan="7">Aucune course pour le moment.</td></tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/layout :: pager(${page}, '/courses')}"></nav>
    </div>

</main>
</body>
</html>
